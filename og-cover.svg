      <stop offset="0" stop-color="#07070a"/>
      <stop offset="0.55" stop-color="#0d0b12"/>
      <stop offset="1" stop-color="#2a1006"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#ff5a1f" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
