    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#ff9a63"/>
      <stop offset="1" stop-color="#ff5a1f"/>
